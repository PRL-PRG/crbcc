# Builds and tests crbcc, and measures its performance with the benchmarks.
# The jobs:
#
#   build      Runs R CMD build, which also builds the vignette. The artifact
#              "package" is the package source.
#   test       Runs R CMD check of the package source on Linux and macOS. The
#              check runs tests/compare.R. If the check gives an ERROR or a
#              WARNING, the job is a failure.
#   closures   Runs the suites check and closures of
#              inst/benchmarks/crbcc_bench.py for the base and recommended
#              packages, with the crbcc of the artifact "package". It runs in
#              the image ghcr.io/prl-prg/crbcc-benchmarks
#              (inst/benchmarks/docker). If a byte code is different, the job
#              is a failure. The artifact "closures" has closures.csv.
#   report     Makes the report inst/benchmarks/crbcc_bench.Rmd from the
#              install benchmark results in the image (install.csv) and from
#              closures.csv. The artifact "report" has the report, the two
#              CSVs and the vignette.
#   pages      Only for a push to main: puts the report on GitHub Pages.
#              README.md shows its figure and its badge.
#
# Before the first push to main, set Settings > Pages > Source to
# "GitHub Actions".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous push. A run on
# main is not cancelled, because it puts the report on GitHub Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
      # The benchmark image tag is in the Makefile.
      - id: image
        run: echo "image=ghcr.io/prl-prg/crbcc-benchmarks:$(make -s image-tag)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: R CMD build .
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: crbcc_*.tar.gz

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # R CMD check builds the vignette again.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD check --no-manual crbcc_*.tar.gz
          # If the log has a WARNING, stop the job with an error. R CMD check
          # does this only for an ERROR.
          ! grep -E '^Status: .*WARNING' crbcc.Rcheck/00check.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.os }}
          path: crbcc.Rcheck

  closures:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: bench
      # crbcc_bench.py uses the crbcc in pkg-lib, not the crbcc of the image.
      # If a run is a failure, crbcc_bench.py exits with 1.
      - name: Closures
        working-directory: bench
        run: |
          mkdir pkg-lib
          R CMD INSTALL --library=pkg-lib crbcc_*.tar.gz
          uv run --script ../inst/benchmarks/crbcc_bench.py \
            --include '^check/' --include '^closures/' \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-progress --csv closures.csv
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: closures
          path: bench/closures.csv

  # Make the report also if closures is a failure, because it shows the
  # failures.
  report:
    needs: [build, closures]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bench
          merge-multiple: true
      - name: Report
        working-directory: bench
        run: |
          cp "$CRBCC_BENCHMARKS/install.csv" .
          Rscript -e 'rmarkdown::render("../inst/benchmarks/crbcc_bench.Rmd",
            output_dir = "site", output_file = "index.html", knit_root_dir = getwd(),
            params = list(install = "install.csv", closures = "closures.csv", assets = "site"))'
          cp install.csv closures.csv site/
          tar -xzf crbcc_*.tar.gz -O crbcc/inst/doc/crbcc.html > site/crbcc.html
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: bench/site
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bench/site

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, closures, report]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
