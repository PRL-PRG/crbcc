# Builds and tests crbcc, and measures its performance with the benchmarks.
# The jobs:
#
#   build      Runs R CMD build, which also builds the vignette. The artifact
#              "package" is the package source.
#   test       Runs R CMD check of the package source on Linux and macOS. The
#              check runs tests/compare.R. If the check gives an ERROR or a
#              WARNING, the job is a failure.
#   check      Runs make test-compile-all-packages (the suite check of
#              inst/benchmarks/crbcc_bench.py) in the image
#              ghcr.io/prl-prg/crbcc-benchmarks (inst/benchmarks/docker).
#              The suite installs all packages in the image one time with
#              crbcc, and compares the byte code of each closure with the
#              GNU R byte code in the image. The installations are parallel,
#              because the suite does not measure the time. If a byte code is
#              different, the job is a failure.
#   benchmark  Runs the suite install of crbcc_bench.py in the same image,
#              for the packages top50 and recommended. The job runs gnur and
#              crbcc on the same runner, because the report divides their
#              times.
#   report     Makes the report inst/benchmarks/crbcc_bench.Rmd from the
#              results of check and benchmark. The artifact "report" has the
#              report, the CSVs and the vignette.
#   pages      Only for a push to main: puts the report on GitHub Pages.
#              README.md shows its figure and its badge.
#
# Before the first push to main, set Settings > Pages > Source to
# "GitHub Actions".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
      # The benchmark image tag is a hash of inst/benchmarks/docker and of
      # the hook. Refer to the target image-tag of the Makefile.
      - id: image
        run: echo "image=ghcr.io/prl-prg/crbcc-benchmarks:$(make -s image-tag)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: R CMD build .
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: crbcc_*.tar.gz

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # R CMD check builds the vignette again.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD check --no-manual crbcc_*.tar.gz
          # If the log has a WARNING, stop the job with an error. R CMD check
          # does this only for an ERROR.
          ! grep -E '^Status: .*WARNING' crbcc.Rcheck/00check.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.os }}
          path: crbcc.Rcheck

  # check and benchmark run in parallel. They run the same script, each with
  # one suite (--include). If a run is a failure, crbcc_bench.py exits with 1.
  check:
    needs: build
    runs-on: ubuntu-latest
    # The image has R, uv, pandoc and the benchmark packages. The image build
    # compiles their native code one time.
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Check
        run: make test-compile-all-packages
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: check
          path: bench/check.csv

  benchmark:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: bench
      - name: Benchmark
        working-directory: bench
        run: |
          mkdir pkg-lib
          R CMD INSTALL --library=pkg-lib crbcc_*.tar.gz
          uv run --script ../inst/benchmarks/crbcc_bench.py --r "$(which R)" \
            --prebuilt "$CRBCC_BENCHMARKS" --include '^install/' \
            --packages top50 --packages recommended \
            --runs 3 --no-progress --csv results.csv
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: results
          path: bench/results.csv

  # Make the report also if check or benchmark is a failure, because it
  # shows the failures.
  report:
    needs: [build, check, benchmark]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: bench
          merge-multiple: true
      - name: Report
        working-directory: bench
        run: |
          Rscript -e 'rmarkdown::render("../inst/benchmarks/crbcc_bench.Rmd",
            output_dir = "site", output_file = "index.html", knit_root_dir = getwd(),
            params = list(csv = "check.csv,results.csv", assets = "site"))'
          cp check.csv results.csv site/
          tar -xzf crbcc_*.tar.gz -O crbcc/inst/doc/crbcc.html > site/crbcc.html
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: bench/site
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: bench/site

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, check, benchmark, report]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
