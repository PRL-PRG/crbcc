# Builds and tests crbcc, and measures its performance with the benchmarks.
# The jobs:
#
#   build      Runs R CMD build, which also builds the vignette. The artifact
#              "package" is the package source.
#   pkgdown    Builds the pkgdown site of _pkgdown.yml: the home page from
#              README.md, the reference and the vignette. The artifact
#              "pkgdown" has the site.
#   test       Runs R CMD check of the package source on Linux and macOS. The
#              check runs tests/compare.R. If the check gives an ERROR or a
#              WARNING, the job is a failure.
#   compile    Runs the suites check and compile of
#              inst/benchmarks/crbcc_bench.py, with the crbcc of the artifact
#              "package". The suite compile uses the 65 packages of the
#              install benchmark. The suite check uses the base packages and
#              the same 65 packages. It runs in the image
#              ghcr.io/prl-prg/crbcc-benchmarks (inst/benchmarks/docker). If a
#              byte code is different, the job is a failure. The artifact
#              "compile" has compile.csv.
#   report     Makes the report inst/benchmarks/crbcc_bench.Rmd from the
#              install benchmark results in the image (install.csv) and from
#              compile.csv. The artifact "report" has the report
#              benchmarks.html, its figure, its badge and the two CSVs.
#   pages      Only for a push to main: puts the artifacts "pkgdown" and
#              "report" on GitHub Pages, in one directory. The navbar of the
#              site links to benchmarks.html. README.md shows the figure and
#              the badge of the report.
#
# Before the first push to main, set Settings > Pages > Source to
# "GitHub Actions".

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run of the previous push. A run on
# main is not cancelled, because it puts the site on GitHub Pages.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
      # The benchmark image tag is in the Makefile.
      - id: image
        run: echo "image=ghcr.io/prl-prg/crbcc-benchmarks:$(make -s image-tag)" >> "$GITHUB_OUTPUT"
      - name: Build
        run: R CMD build .
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: crbcc_*.tar.gz

  # pkgdown imports ragg. The benchmark image does not have the system
  # libraries of ragg, thus this job does not use the image.
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
      # The site uses the crbcc that setup-r-dependencies installed.
      - name: Build
        run: Rscript -e 'pkgdown::build_site(new_process = FALSE, install = FALSE)'
      - uses: actions/upload-artifact@v7
        with:
          name: pkgdown
          path: docs

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      # R CMD check builds the vignette again.
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::knitr, any::rmarkdown
      - uses: actions/download-artifact@v8
        with:
          name: package
      - name: Check
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R CMD check --no-manual crbcc_*.tar.gz
          # If the log has a WARNING, stop the job with an error. R CMD check
          # does this only for an ERROR.
          ! grep -E '^Status: .*WARNING' crbcc.Rcheck/00check.log
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-${{ matrix.os }}
          path: crbcc.Rcheck

  compile:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: bench
      # crbcc_bench.py uses the crbcc in pkg-lib, not the crbcc of the image.
      # If a run is a failure, crbcc_bench.py exits with 1.
      - name: Compile
        working-directory: bench
        run: |
          mkdir pkg-lib
          R CMD INSTALL --library=pkg-lib crbcc_*.tar.gz
          uv run --script ../inst/benchmarks/crbcc_bench.py \
            --include '^check/' --include '^compile/' \
            --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --no-progress --csv compile.csv
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compile
          path: bench/compile.csv

  # Make the report also if compile is a failure, because it shows the
  # failures.
  report:
    needs: [build, compile]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.build.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: compile
          path: bench
      # The image has no reactable. Install it and its missing dependencies
      # from the CRAN snapshot of the image into a library of the job.
      - name: Report
        working-directory: bench
        run: |
          mkdir rlib
          Rscript -e 'install.packages("reactable", "rlib", repos = Sys.getenv("CRAN_SNAPSHOT"))'
          cp "$CRBCC_BENCHMARKS/install.csv" .
          R_LIBS="$PWD/rlib:$R_LIBS" Rscript -e 'rmarkdown::render("../inst/benchmarks/crbcc_bench.Rmd",
            output_dir = "site", output_file = "benchmarks.html", knit_root_dir = getwd(),
            params = list(install = "install.csv", compile = "compile.csv", assets = "site"))'
          cp install.csv compile.csv site/
      - uses: actions/upload-artifact@v7
        with:
          name: report
          path: bench/site

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [test, compile, report, pkgdown]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The two artifacts have no file in common.
      - uses: actions/download-artifact@v8
        with:
          name: pkgdown
          path: site
      - uses: actions/download-artifact@v8
        with:
          name: report
          path: site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
